name: Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          rm -rf "$HOME/android-sdk/cmdline-tools/latest"
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          mv cmdline-tools/* "$HOME/android-sdk/cmdline-tools/latest/"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "sdk.dir=$HOME/android-sdk" > "$GITHUB_WORKSPACE/local.properties"
      - name: Pin llama.cpp
        run: git clone --depth 1 --branch b3962 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew :bureau-core:test --stacktrace
      - name: Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: sara-ai-offline-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
