name: Apply settings-models patch
on:
  workflow_dispatch:
  push:
    branches: [fix/settings-models-controls]
    paths:
      - 'patches/pcb64/**'
      - '.github/workflows/apply-settings-models-patch.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/settings-models-controls
          fetch-depth: 0
      - name: Decode pchunks and apply patch
        run: |
          set -euo pipefail
          : > /tmp/new-ma.patch
          for i in $(seq -w 0 39); do
            f=$(printf 'patches/pcb64/%03d.b64' $((10#$i)))
            test -f "$f"
            base64 -d "$f" >> /tmp/new-ma.patch
          done
          echo "patch_bytes=$(wc -c < /tmp/new-ma.patch)"
          echo "patch_md5=$(md5sum /tmp/new-ma.patch | awk '{print $1}')"
          test "$(wc -c < /tmp/new-ma.patch)" -eq 29713
          test "$(md5sum /tmp/new-ma.patch | awk '{print $1}')" = "aa1e9ccaa23b21cb24ad94c02aa58e88"
          if ! git apply --check /tmp/new-ma.patch; then
            echo "git apply --check FAILED"
            exit 1
          fi
          git apply /tmp/new-ma.patch
          grep -q "Import GGUF" app/src/main/java/com/saraai/offline/MainActivity.kt
          grep -q "Cloud API configuration" app/src/main/java/com/saraai/offline/MainActivity.kt
          grep -q "Clear state" app/src/main/java/com/saraai/offline/MainActivity.kt
          grep -q 'Text("Load")' app/src/main/java/com/saraai/offline/MainActivity.kt
          grep -q "not auto-connected" app/src/main/java/com/saraai/offline/MainActivity.kt
          echo "markers OK"
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew :bureau-core:test --stacktrace
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/saraai/offline/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix: Settings always-visible cloud API, GGUF import, model Load/Clear (no auto-connect)"
          git push origin fix/settings-models-controls
