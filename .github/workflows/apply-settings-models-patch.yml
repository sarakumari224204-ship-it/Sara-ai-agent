name: Apply settings-models patch
on:
  workflow_dispatch:
  push:
    branches: [fix/settings-models-controls]
    paths:
      - 'patches/b64/**'
      - '.github/workflows/apply-settings-models-patch.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/settings-models-controls
          fetch-depth: 0
      - name: Decode and apply patch safely
        run: |
          set -euo pipefail
          cat patches/b64/part00.b64 patches/b64/part01.b64 patches/b64/part02.b64 patches/b64/part03.b64 patches/b64/part04.b64 patches/b64/part05.b64 patches/b64/part06.b64 patches/b64/part07.b64 patches/b64/part08.b64 patches/b64/part09.b64 patches/b64/part10.b64 | base64 -d > /tmp/mainactivity-settings-models.patch
          wc -c /tmp/mainactivity-settings-models.patch
          head -5 /tmp/mainactivity-settings-models.patch
          if git apply --check /tmp/mainactivity-settings-models.patch; then
            git apply /tmp/mainactivity-settings-models.patch
          else
            echo "Patch does not apply cleanly. Aborting without changes."
            git apply --check /tmp/mainactivity-settings-models.patch || true
            exit 1
          fi
          grep -q "Import GGUF" app/src/main/java/com/saraai/offline/MainActivity.kt
          grep -q "Cloud API configuration" app/src/main/java/com/saraai/offline/MainActivity.kt
          grep -q "Clear state" app/src/main/java/com/saraai/offline/MainActivity.kt
          grep -q 'Text("Load")' app/src/main/java/com/saraai/offline/MainActivity.kt
          wc -c app/src/main/java/com/saraai/offline/MainActivity.kt
      - name: Commit patched MainActivity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/saraai/offline/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: Settings always-visible cloud API, GGUF import, model Load/Clear controls"
          git push origin fix/settings-models-controls
