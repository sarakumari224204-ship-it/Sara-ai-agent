name: Apply surgical MainActivity fixes
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/settings-models-controls
          fetch-depth: 0
      - name: Assemble patcher
        run: |
          cat tools/pma_part1.py tools/pma_gap.py tools/pma_part2.py > tools/patch_mainactivity.py
          wc -c tools/patch_mainactivity.py
          python3 -m py_compile tools/patch_mainactivity.py
      - name: Run surgical patch (abort on failure, no commit)
        run: |
          set -e
          python3 tools/patch_mainactivity.py
          grep -q "Cloud API / API Key" app/src/main/java/com/saraai/offline/MainActivity.kt
          grep -q "Pick GGUF" app/src/main/java/com/saraai/offline/MainActivity.kt
          grep -q "Memory / Knowledge" app/src/main/java/com/saraai/offline/MainActivity.kt
          grep -q "Reply delay" app/src/main/java/com/saraai/offline/MainActivity.kt
          grep -q "Load / Use Local" app/src/main/java/com/saraai/offline/MainActivity.kt
          grep -q "error loading keys" app/src/main/java/com/saraai/offline/MainActivity.kt
          grep -q "Version 2.1.1" app/src/main/java/com/saraai/offline/MainActivity.kt
          grep -q 'Text("Connect")' app/src/main/java/com/saraai/offline/MainActivity.kt
          grep -q "isDownloaded" app/src/main/java/com/saraai/offline/MainActivity.kt
          echo "ALL MARKERS VERIFIED"
      - name: Commit only if verified
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/saraai/offline/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No change to commit"
            exit 0
          fi
          git commit -m "fix(settings/models): Cloud API always visible, GGUF picker, Memory/delay, crash harden (v2.1.1)"
          git push origin HEAD:fix/settings-models-controls
