name: Restore MainActivity from main
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/settings-models-controls
          fetch-depth: 0
      - name: Restore MainActivity.kt from main
        run: |
          git fetch origin main
          git checkout origin/main -- app/src/main/java/com/saraai/offline/MainActivity.kt
          md5sum app/src/main/java/com/saraai/offline/MainActivity.kt
          head -5 app/src/main/java/com/saraai/offline/MainActivity.kt
          wc -l app/src/main/java/com/saraai/offline/MainActivity.kt
          if grep -q '^PLACEHOLDER$' app/src/main/java/com/saraai/offline/MainActivity.kt; then
            echo "ERROR: still PLACEHOLDER"
            exit 1
          fi
          if ! grep -q 'package com.saraai.offline' app/src/main/java/com/saraai/offline/MainActivity.kt; then
            echo "ERROR: not valid Kotlin"
            exit 1
          fi
      - name: Commit restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/saraai/offline/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No change needed"
          else
            git commit -m "fix: restore MainActivity.kt baseline from main (remove PLACEHOLDER)"
            git push origin HEAD:fix/settings-models-controls
          fi
